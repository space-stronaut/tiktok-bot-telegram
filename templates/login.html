<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · Tiktok Bot Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 20% 20%, #1f2937 0, #0b1220 45%, #050914 100%); }
    .login-card { max-width: 420px; width: 100%; border: 0; border-radius: 1rem; }
  </style>
</head>
<body class="p-3">
  <div class="card login-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="display-5 text-primary mb-2"><i class="bi bi-robot"></i></div>
        <h1 class="h3 fw-bold mb-1">Tiktok Bot Manager</h1>
        <p class="text-secondary small mb-0">Masuk untuk mengelola bot & pesanan.</p>
      </div>
      {{if .Err}}
      <div class="alert alert-danger py-2 small" role="alert">{{.Err}}</div>
      {{end}}
      <form method="post" action="/login" autocomplete="off">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="username">Username</label>
          <input class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i>Masuk
        </button>
      </form>
    </div>
  </div>
</body>
</html>
