{{define "content"}}
<div class="mb-3">
  <h1 class="h3 mb-1">Broadcast</h1>
  <p class="text-secondary mb-0 small">Kirim pesan ke semua pengguna yang pernah order, atau ke satu pengguna tertentu. Pengguna yang diblokir otomatis dilewati.</p>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" action="/broadcast">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Isi pesan (boleh format HTML Telegram, mis. &lt;b&gt;tebal&lt;/b&gt;)</label>
        <textarea class="form-control" name="text" rows="6" required
                  placeholder="📢 Pengumuman: stok baru sudah tersedia!"></textarea>
        <div class="form-text">Maksimal 3500 karakter.</div>
      </div>
      <div class="mb-3">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="target" id="target_all" value="all" checked>
          <label class="form-check-label" for="target_all"><b>Semua pengguna</b> (yang pernah membuat order)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="target" id="target_user" value="user">
          <label class="form-check-label" for="target_user"><b>Pengguna tertentu</b> (Chat ID)</label>
        </div>
        <input class="form-control mono mt-2" type="text" name="chat_id" placeholder="Chat ID, contoh: 5522801525" style="max-width:320px">
      </div>
      <button class="btn btn-primary" type="submit" data-confirm="Kirim broadcast ini sekarang?">
        <i class="bi bi-send me-1"></i>Kirim Broadcast
      </button>
    </form>
  </div>
</div>
{{end}}
