<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Tiktok Bot Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; }
    .metric { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
    .table-tight td, .table-tight th { padding: .45rem .6rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
    .navbar-brand { font-weight: 700; letter-spacing: .2px; }
  </style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg bg-dark shadow-sm" data-bs-theme="dark">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-robot me-1"></i> Tiktok Bot Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link {{if eq .Active "dashboard"}}active{{end}}" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{if eq .Active "orders"}}active{{end}}" href="/orders">Pesanan</a></li>
        <li class="nav-item"><a class="nav-link {{if eq .Active "stock"}}active{{end}}" href="/stock">Stok</a></li>
        <li class="nav-item"><a class="nav-link {{if eq .Active "texts"}}active{{end}}" href="/texts">Teks Bot</a></li>
        <li class="nav-item"><a class="nav-link {{if eq .Active "settings"}}active{{end}}" href="/settings">Pengaturan</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text small"><i class="bi bi-telegram me-1"></i>@{{.BotName}}</span>
        <a class="nav-link small {{if eq .Active "password"}}active{{end}}" href="/password"><i class="bi bi-person-gear me-1"></i>{{.User}}</a>
        <form method="post" action="/logout" class="m-0">
          <input type="hidden" name="csrf" value="{{.CSRF}}">
          <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Keluar</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<main class="container-fluid px-4 py-4">
  {{if .Flash}}
  <div class="alert alert-{{.FlashKind}} alert-dismissible fade show shadow-sm" role="alert">
    {{.Flash}}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Tutup"></button>
  </div>
  {{end}}
  {{template "content" .}}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
