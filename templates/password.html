{{define "content"}}
<div class="row justify-content-center">
  <div class="col-lg-6 col-xl-5">
    <h1 class="h3 mb-1">Ganti Password</h1>
    <p class="text-secondary small mb-4">Masuk sebagai <b>{{.User}}</b>.</p>

    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" action="/password" autocomplete="off">
          <input type="hidden" name="csrf" value="{{.CSRF}}">
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="current_password">Password saat ini</label>
            <input class="form-control" id="current_password" name="current_password" type="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="new_password">Password baru</label>
            <input class="form-control" id="new_password" name="new_password" type="password" minlength="8" required>
            <div class="form-text">Minimal 8 karakter.</div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold" for="confirm_password">Ulangi password baru</label>
            <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required>
          </div>
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-key me-1"></i>Simpan password</button>
        </form>
      </div>
    </div>
    <div class="small text-secondary mt-3">Setelah diganti, session lain milik user ini otomatis keluar.</div>
  </div>
</div>
{{end}}
